<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minion Assistant Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 1rem;
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .btn-banana {
            background-color: #ffcc00;
            color: #2c3e50;
            font-weight: 600;
            border: none;
        }
        .btn-banana:hover {
            background-color: #e6b800;
            color: #1a252f;
        }
        .minion-badge {
            background-color: #ffcc00;
            color: #2c3e50;
            font-size: 1.1rem;
            padding: 0.5rem 1.2rem;
            border-radius: 50rem;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.07);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <header class="text-center mb-5">
            <div class="mb-3">
                <span class="minion-badge fw-bold shadow-sm">
                    <i class="fa-solid fa-robot me-2"></i>I'm Minion! Let me assist you with your queries.
                </span>
            </div>
            <p class="text-muted lead">Drop your files and ask away—I'm ready to help!</p>
        </header>

        <div class="row g-4 justify-content-center">
            <!-- Upload Card -->
            <div class="col-lg-5">
                <div class="card shadow-lg h-100">
                    <div class="card-body p-4">
                        <h3 class="card-title h5 mb-3 text-secondary"><i class="fa-solid fa-cloud-arrow-up me-2"></i>Upload Document</h3>
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <input class="form-control" type="file" id="fileInput" name="file" required>
                            </div>
                            <button type="submit" class="btn btn-banana w-100 py-2 shadow-sm">Upload & Process</button>
                        </form>
                        <div id="uploadResult" class="mt-3 alert d-none"></div>
                    </div>
                </div>
            </div>

            <!-- Query Card -->
            <div class="col-lg-5">
                <div class="card shadow-lg h-100">
                    <div class="card-body p-4">
                        <h3 class="card-title h5 mb-3 text-secondary"><i class="fa-solid fa-comments me-2"></i>Ask Minion</h3>
                        <form id="queryForm">
                            <div class="mb-3">
                                <textarea class="form-control" id="queryInput" rows="3" placeholder="Ask something about your documents..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 py-2 shadow-sm">Generate Answer</button>
                        </form>
                        <div id="queryResult" class="mt-3 p-3 bg-light border rounded d-none" style="white-space: pre-wrap;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Upload Handler
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', document.getElementById('fileInput').files[0]);
            const resDiv = document.getElementById('uploadResult');
            
            resDiv.className = "mt-3 alert alert-info";
            resDiv.textContent = "Bello! Processing your document...";
            resDiv.classList.remove('d-none');

            try {
                const response = await fetch('/api/documents/upload', { method: 'POST', body: formData });
                const text = await response.text();
                resDiv.className = response.ok ? "mt-3 alert alert-success" : "mt-3 alert alert-danger";
                resDiv.textContent = text;
            } catch (err) {
                resDiv.className = "mt-3 alert alert-danger";
                resDiv.textContent = "Upload failed: " + err.message;
            }
        });

        // Query Handler
        document.getElementById('queryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('queryInput').value;
            const resDiv = document.getElementById('queryResult');
            
            resDiv.className = "mt-3 p-3 bg-light border rounded alert alert-secondary";
            resDiv.textContent = "Processing query...";
            resDiv.classList.remove('d-none');

            try {
            	const response = await fetch(`/api/documents/ask?query=${encodeURIComponent(query)}`, { method: 'GET' });
                const text = await response.text();
                
                if (!response.ok) {
                    throw new Error(text || "Server error occurred");
                }

                resDiv.className = "mt-3 p-3 bg-white border rounded alert alert-light";
                resDiv.textContent = text;
            } catch (err) {
                resDiv.className = "mt-3 p-3 bg-white border rounded alert alert-danger";
                resDiv.textContent = "Query failed: " + err.message;
            }
        });
    </script>
</body>
</html>
